<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="60" cy="38" rx="28" ry="12" fill="#1e3a5a" opacity="0.7"/>
  <ellipse cx="80" cy="32" rx="22" ry="10" fill="#1e3a5a" opacity="0.7"/>
  <ellipse cx="200" cy="50" rx="20" ry="9" fill="#1e3a5a" opacity="0.5"/>
  <ellipse cx="218" cy="44" rx="16" ry="8" fill="#1e3a5a" opacity="0.5"/>

  <!-- Ground (grass) -->
  <rect x="0" y="148" width="320" height="32" fill="#3a6b20"/>
  <!-- Dirt -->
  <rect x="0" y="158" width="320" height="22" fill="#7a4a1a"/>

  <!-- === STRUCTURE (right side) === -->
  <rect x="208" y="108" width="18" height="40" rx="2" fill="#c8902a" stroke="#6b4a10" stroke-width="1.5"/>
  <rect x="248" y="108" width="18" height="40" rx="2" fill="#c8902a" stroke="#6b4a10" stroke-width="1.5"/>
  <rect x="204" y="100" width="70" height="14" rx="2" fill="#d4a040" stroke="#6b4a10" stroke-width="1.5"/>
  <rect x="222" y="78" width="32" height="26" rx="2" fill="#c8902a" stroke="#6b4a10" stroke-width="1.5"/>

  <!-- === PIG === -->
  <circle cx="238" cy="70" r="14" fill="#4aaa28" stroke="#2a7a10" stroke-width="2"/>
  <ellipse cx="238" cy="74" rx="7" ry="5" fill="#3a8a20" stroke="#2a7a10" stroke-width="1"/>
  <circle cx="235" cy="75" r="2" fill="#2a6a10"/>
  <circle cx="241" cy="75" r="2" fill="#2a6a10"/>
  <circle cx="233" cy="67" r="4" fill="white"/>
  <circle cx="243" cy="67" r="4" fill="white"/>
  <circle cx="234" cy="67" r="2" fill="#1a1a1a"/>
  <circle cx="244" cy="67" r="2" fill="#1a1a1a"/>
  <line x1="230" y1="63" x2="237" y2="65" stroke="#2a7a10" stroke-width="2" stroke-linecap="round"/>
  <line x1="246" y1="65" x2="239" y2="63" stroke="#2a7a10" stroke-width="2" stroke-linecap="round"/>

  <!-- === SLINGSHOT === -->
  <rect x="72" y="100" width="8" height="50" rx="3" fill="#7a4a18"/>
  <line x1="76" y1="105" x2="62" y2="88" stroke="#7a4a18" stroke-width="6" stroke-linecap="round"/>
  <line x1="76" y1="105" x2="90" y2="88" stroke="#7a4a18" stroke-width="6" stroke-linecap="round"/>

  <!-- === ACTIVE POOP (on slingshot) === -->
  <!-- Elastic bands -->
  <line x1="62" y1="88" x2="76" y2="106" stroke="#d4a040" stroke-width="2" opacity="0.8"/>
  <line x1="90" y1="88" x2="76" y2="106" stroke="#d4a040" stroke-width="2" opacity="0.8"/>
  <!-- Poop body: stacked blobs -->
  <g transform="translate(76, 113)">
    <ellipse cx="0"   cy="3"    rx="9.5" ry="8"   fill="#8B4513"/>
    <ellipse cx="0.8" cy="-3.5" rx="7"   ry="6.5" fill="#8B4513"/>
    <ellipse cx="1.5" cy="-9.5" rx="4.5" ry="4"   fill="#8B4513"/>
    <ellipse cx="2"   cy="-14"  rx="2.5" ry="2.5" fill="#8B4513"/>
    <!-- Shine -->
    <ellipse cx="-4" cy="0" rx="2.5" ry="1.8" fill="rgba(200,130,70,0.5)" transform="rotate(-30,-4,0)"/>
    <!-- Eyes -->
    <circle cx="-3"  cy="-3.5" r="2.8" fill="white"/>
    <circle cx="3.2" cy="-3.5" r="2.8" fill="white"/>
    <circle cx="-2.4" cy="-3" r="1.4" fill="#111"/>
    <circle cx="3.8"  cy="-3" r="1.4" fill="#111"/>
    <!-- Angry brows -->
    <line x1="-7"  y1="-7.5" x2="-1.5" y2="-5.5" stroke="#4a1f00" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7.2" y1="-7.5" x2="1.8"  y2="-5.5" stroke="#4a1f00" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Frown -->
    <path d="M -3 -0.5 Q 0.5 2.5 4 -0.5" fill="none" stroke="#4a1f00" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- === POOP QUEUE (waiting on ground) === -->
  <g transform="translate(34, 144)">
    <ellipse cx="0"   cy="2"   rx="7"   ry="6"   fill="#8B4513"/>
    <ellipse cx="0.5" cy="-3"  rx="5.2" ry="4.8" fill="#8B4513"/>
    <ellipse cx="1"   cy="-7"  rx="3.3" ry="3"   fill="#8B4513"/>
    <ellipse cx="1.3" cy="-10" rx="1.8" ry="1.8" fill="#8B4513"/>
    <circle cx="-2"  cy="-3" r="1.8" fill="white"/>
    <circle cx="2.5" cy="-3" r="1.8" fill="white"/>
    <circle cx="-1.5" cy="-2.6" r="0.9" fill="#111"/>
    <circle cx="3"    cy="-2.6" r="0.9" fill="#111"/>
  </g>

  <g transform="translate(54, 144)">
    <ellipse cx="0"   cy="2"   rx="7"   ry="6"   fill="#8B4513"/>
    <ellipse cx="0.5" cy="-3"  rx="5.2" ry="4.8" fill="#8B4513"/>
    <ellipse cx="1"   cy="-7"  rx="3.3" ry="3"   fill="#8B4513"/>
    <ellipse cx="1.3" cy="-10" rx="1.8" ry="1.8" fill="#8B4513"/>
    <circle cx="-2"  cy="-3" r="1.8" fill="white"/>
    <circle cx="2.5" cy="-3" r="1.8" fill="white"/>
    <circle cx="-1.5" cy="-2.6" r="0.9" fill="#111"/>
    <circle cx="3"    cy="-2.6" r="0.9" fill="#111"/>
  </g>
</svg>
